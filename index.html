<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>MACHAA OS</title>
<style>
:root{--bg:#0b0b0b;--c:#161616;--c2:#222;--t:#f2f2f2;--m:#8a8a8a;--g:#22c55e;--r:#ef4444}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font:15px/1.4 system-ui,sans-serif;padding:14px 14px 88px;max-width:560px;margin:auto}
h1{font-size:13px;letter-spacing:3px;color:var(--g)}h2{font-size:20px;margin:6px 0}h3{margin-bottom:8px}
.m,small{color:var(--m);font-size:13px}.big{font-size:44px;font-weight:700}
.card{background:var(--c);border-radius:14px;padding:13px;margin:10px 0}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:8px;background:var(--c2);border-radius:5px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111;border-top:1px solid var(--c2);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--m);padding:14px 0;font-size:12px}nav button.on{color:var(--g);font-weight:700}
button,input,select{font:inherit;color:var(--t)}
.b{background:var(--g);color:#000;border:0;border-radius:10px;padding:11px 16px;font-weight:700}.b2{background:var(--c2);border:0;border-radius:10px;padding:11px 16px}
input,select{width:100%;background:var(--c2);border:1px solid #333;border-radius:10px;padding:11px;margin:4px 0 10px}
input[type=checkbox]{width:24px;height:24px;margin:0;accent-color:var(--g)}
label{font-size:13px;color:var(--m)}
.task{display:flex;align-items:center;gap:10px;background:var(--c);border-radius:12px;padding:11px;margin:8px 0}.task .g{flex:1}.task.dn .g>div{text-decoration:line-through;color:var(--m)}
.task button{background:var(--c2);border:0;border-radius:8px;padding:7px 10px;font-size:13px}
.empty{text-align:center;color:var(--m);padding:40px 10px}
.fab{position:fixed;right:16px;bottom:76px;background:var(--g);color:#000;border:0;border-radius:28px;padding:14px 20px;font-weight:700}
#m{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;z-index:9}#m>div{background:var(--c);width:100%;max-width:560px;margin:auto;border-radius:18px 18px 0 0;padding:16px;max-height:92%;overflow:auto}
.err{color:var(--r);font-size:13px;min-height:18px;margin-bottom:6px}
.ch{display:flex;align-items:flex-end;gap:6px;height:120px;position:relative;margin-top:10px}.ch div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center;font-size:11px;color:var(--m)}.ch i{display:block;border-radius:4px 4px 0 0;min-height:3px}
.ln{position:absolute;left:0;right:0;border-top:1px dashed #666}
ul{padding-left:18px}li{margin:4px 0}
</style></head><body>
<h1>MACHAA OS</h1><div id="v"></div><div id="m" onclick="if(event.target===this)hide()"><div id="mb"></div></div>
<nav><button data-t="home" onclick="go('home')">Home</button><button data-t="tasks" onclick="go('tasks')">Tasks</button><button data-t="insta" onclick="go('insta')">Insta</button><button data-t="score" onclick="go('score')">Score</button><button data-t="week" onclick="go('week')">Week</button><button data-t="more" onclick="go('more')">More</button></nav>
<script>
const CATS=['College & Studies','Boxing & Fitness','CAD & AI Learning','Personal Development','Sleep & Recovery'],PRI=['High','Medium','Low'],KEY='machaaos.v1';
const Q=['Discipline beats motivation. Do the next task.','Small wins stack. Finish one thing now.','Show up even when it is boring.','Your future self is watching today.','Less scrolling, more building.','Train the body, sharpen the mind.','Done is better than perfect.','Every rep, every page, every line counts.','Win the morning, win the day.','Consistency is the real talent.','Make today count, not just pass.','Hard now, easy later.','Focus on the process, the score follows.','One hour of deep work beats five distracted.'];
const ALT=['Do a 3-round shadowboxing set','Study one 25-minute focus block','Watch one CAD tutorial and model along','Go for a 10-minute walk','Read 10 pages of a book','Stretch and drink water','Plan tomorrow in 5 minutes','Do 20 push-ups'];
const DEF={tasks:[],insta:{},sleep:{},set:{limit:60,sleepT:7,cs:'09:00',ce:'17:00',w:{tasks:40,study:25,fit:20,insta:10,sleep:5}}};
function norm(s){const o=JSON.parse(JSON.stringify(DEF));if(s&&Array.isArray(s.tasks)){o.tasks=s.tasks;o.insta=s.insta||{};o.sleep=s.sleep||{};Object.assign(o.set,s.set||{});o.set.w=Object.assign({},DEF.set.w,(s.set||{}).w)}return o}
function load(){try{return norm(JSON.parse(localStorage.getItem(KEY)))}catch(e){return norm()}}
let S=load(),tab='home',iD=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save: storage is full or blocked.')}}
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const wd=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'});
const bar=(p,c)=>`<div class=bar><i style="width:${Math.round(Math.min(1,p)*100)}%;background:${c||'var(--g)'}"></i></div>`;
const tfor=d=>S.tasks.filter(t=>t.rec?d>=t.created:t.date===d),dn=(t,d)=>!!t.done[d];
function ratio(d,c){const l=tfor(d).filter(t=>c==null||t.cat===c);return{n:l.filter(t=>dn(t,d)).length,t:l.length}}
const rr=x=>x.t?x.n/x.t:0,sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
function score(d){const w=S.set.w,tot=sum(w)||1,i=S.insta[d],s=S.sleep[d];
const p={tasks:rr(ratio(d))*w.tasks,study:rr(ratio(d,0))*w.study,fit:rr(ratio(d,1))*w.fit,insta:(i!=null&&i<=S.set.limit)?w.insta:0,sleep:(s!=null&&s>=S.set.sleepT)?w.sleep:0};
return{p,total:Math.round(sum(p)/tot*100)}}
const V={};
function go(t){tab=t;render()}
function render(){$('v').innerHTML=V[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));window.scrollTo(0,0)}
function mod(h){$('mb').innerHTML=h;$('m').style.display='flex'}function hide(){$('m').style.display='none'}
function err(m){$('er').textContent=m}
V.home=()=>{const d=today(),a=ratio(d),sc=score(d),nm=new Date().toTimeString().slice(0,5),inC=nm>=S.set.cs&&nm<S.set.ce,i=S.insta[d],L=S.set.limit;
const tile=(l,c)=>{const r=ratio(d,c);return`<div class=card onclick="go('tasks')"><small>${l}</small><div class=big style="font-size:24px">${r.t?Math.round(rr(r)*100)+'%':'-'}</div><small>${r.t?r.n+'/'+r.t+' done':'no tasks yet'}</small>${bar(rr(r))}</div>`};
return`<h2>${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2><div class=m>${inC?'In college until '+S.set.ce:'Outside college hours ('+S.set.cs+'-'+S.set.ce+')'}</div>
<div class=card><div class=r><div><small>Daily completion</small><div class=big>${a.t?Math.round(rr(a)*100):0}%</div><small>${a.n} of ${a.t} tasks completed</small></div><div style="text-align:right" onclick="go('score')"><small>Discipline score</small><div class=big>${sc.total}<span class=m style="font-size:16px">/100</span></div></div></div>${bar(rr(a))}</div>
<div class=grid>${tile('Study',0)}${tile('Boxing & fitness',1)}${tile('CAD & AI',2)}<div class=card onclick="go('insta')"><small>Instagram</small><div class=big style="font-size:24px">${i==null?'-':i+'m'}</div><small>${i==null?'not logged':'limit '+L+' min'}</small>${bar(i==null?0:i/L,i>L?'var(--r)':'')}</div></div>
<div class=card><small>Today's message</small><div style="margin-top:4px">${Q[Math.floor(new Date(d).getTime()/864e5)%Q.length]}</div></div>`};
V.tasks=()=>{const d=today(),a=ratio(d),l=tfor(d).sort((x,y)=>dn(x,d)-dn(y,d)||x.pri-y.pri);
return`<h2>Today's tasks</h2><div class=m>${a.n}/${a.t} done</div>`+(l.length?l.map(t=>`<div class="task ${dn(t,d)?'dn':''}"><input type=checkbox ${dn(t,d)?'checked':''} onchange="tg('${t.id}')"><div class=g><div>${esc(t.title)}</div><small>${CATS[t.cat]} · ${PRI[t.pri]}${t.rec?' · repeats daily':''}</small></div><button onclick="tf('${t.id}')">Edit</button><button onclick="tdel('${t.id}')">Del</button></div>`).join(''):`<div class=empty>No tasks for today.<br>Tap "+ Add task" to start.</div>`)+`<button class=fab onclick="tf()">+ Add task</button>`};
function tg(id){const t=S.tasks.find(x=>x.id===id),d=today();if(t.done[d])delete t.done[d];else t.done[d]=1;save();render()}
function tdel(id){if(confirm('Delete this task (and its history)?')){S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}}
function tf(id){const t=S.tasks.find(x=>x.id===id)||{title:'',cat:0,pri:1,rec:false,date:today()},o=(a,s)=>a.map((c,i)=>`<option value=${i} ${i==s?'selected':''}>${c}</option>`).join('');
mod(`<h3>${id?'Edit':'New'} task</h3><label>Title</label><input id=f1 maxlength=80 value="${esc(t.title)}"><label>Category</label><select id=f2>${o(CATS,t.cat)}</select><label>Priority</label><select id=f3>${o(PRI,t.pri)}</select><label>Repeat</label><select id=f4>${o(['Only on the date below','Every day (from the date below)'],t.rec?1:0)}</select><label>Date</label><input id=f5 type=date value="${t.rec?t.created:t.date}"><div class=err id=er></div><div class=r><button class=b2 onclick="hide()">Cancel</button><button class=b onclick="ts('${id||''}')">Save</button></div>`)}
function ts(id){const title=$('f1').value.trim(),date=$('f5').value;if(!title)return err('Enter a task title.');if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return err('Pick a valid date.');
const v={title,cat:+$('f2').value,pri:+$('f3').value,rec:$('f4').value==='1',date,created:date};
if(id)Object.assign(S.tasks.find(x=>x.id===id),v);else S.tasks.push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),done:{}},v));save();hide();render()}
V.insta=()=>{const d=iD||today(),v=S.insta[d],L=S.set.limit,T=today(),days=[0,1,2,3,4,5,6].map(i=>addD(T,i-6)),mx=Math.max(L,...days.map(x=>S.insta[x]||0),1)*1.15,k=Math.floor(new Date(T).getTime()/864e5);
let st='Not logged for this day.';if(v!=null)st=v<=L?`Within limit. ${L-v} min to spare.`:`Over limit by ${v-L} min.`;
const alt=v!=null&&v>L?`<div class=card><b>Try instead</b><ul>${[0,1,2].map(i=>`<li>${ALT[(k+i)%ALT.length]}</li>`).join('')}</ul></div>`:'';
return`<h2>Instagram control</h2><div class=m>Manual log. This app does not block apps.</div><div class=card><label>Date</label><input type=date id=id1 max="${T}" value="${d}" onchange="iD=this.value;render()"><label>Minutes spent</label><input id=im type=number inputmode=numeric min=0 max=1440 value="${v==null?'':v}"><div class=err id=er></div><button class=b onclick="si()">Save minutes</button><div style="margin-top:10px;color:${v!=null&&v>L?'var(--r)':'var(--g)'}">${st}</div></div>${alt}
<div class=card><label>Daily limit (minutes)</label><div class=r><input id=lm type=number inputmode=numeric min=5 max=600 value="${L}"><button class=b2 style="margin-bottom:6px" onclick="sl()">Set</button></div></div>
<div class=card><b>Last 7 days</b><div class=ch><span class=ln style="bottom:${L/mx*100}%"></span>${days.map(x=>{const n=S.insta[x];return`<div>${n!=null?n:''}<i style="height:${n!=null?n/mx*100:2}%;background:${n==null?'#333':n>L?'var(--r)':'var(--g)'}"></i>${wd(x)}</div>`}).join('')}</div><small>Dashed line = your limit (${L} min)</small></div>`};
function si(){const x=$('im').value,n=Number(x);if(x===''||!Number.isInteger(n)||n<0||n>1440)return err('Enter whole minutes from 0 to 1440.');if(($('id1').value||today())>today())return err('Date cannot be in the future.');S.insta[iD||today()]=n;save();render()}
function sl(){const n=Number($('lm').value);if(!Number.isInteger(n)||n<5||n>600)return alert('Limit must be 5-600 minutes.');S.set.limit=n;save();render()}
const LB={tasks:'Tasks completed',study:'Study completed',fit:'Boxing / fitness',insta:'Instagram limit respected',sleep:'Sleep target achieved'};
V.score=()=>{const d=today(),sc=score(d),w=S.set.w,sl=S.sleep[d];
return`<h2>Daily score</h2><div class=card><div class=big>${sc.total}<span class=m style="font-size:16px">/100</span></div>${bar(sc.total/100)}</div><div class=card><b>Breakdown</b>${Object.keys(LB).map(k=>`<div style="margin-top:10px"><div class=r><span>${LB[k]}</span><span>${sc.p[k].toFixed(1)} / ${w[k]}</span></div>${bar(w[k]?sc.p[k]/w[k]:0)}</div>`).join('')}</div>
<div class=card><b>Sleep</b><br><label>Hours slept last night (target ${S.set.sleepT}h)</label><div class=r><input id=sh type=number step=0.5 min=0 max=24 value="${sl==null?'':sl}"><button class=b2 style="margin-bottom:6px" onclick="ssl()">Save</button></div><div class=err id=er></div></div>
<div class=card><b>Customize scoring</b><div class=m>Weights are scaled to 100 if they don't add up to 100 (now ${sum(w)}).</div><br>${Object.keys(LB).map(k=>`<label>${LB[k]} (max points)</label><input id=w_${k} type=number inputmode=numeric min=0 max=100 value="${w[k]}">`).join('')}<label>Sleep target (hours)</label><input id=st type=number step=0.5 min=1 max=14 value="${S.set.sleepT}"><div class=r><button class=b2 onclick="rw()">Reset</button><button class=b onclick="sw()">Save rules</button></div></div>`};
function ssl(){const x=$('sh').value,n=Number(x);if(x===''||isNaN(n)||n<0||n>24)return err('Enter hours from 0 to 24.');S.sleep[today()]=n;save();render()}
function sw(){const w={};for(const k in LB){const n=Number($('w_'+k).value);if(!Number.isInteger(n)||n<0||n>100)return err('Points must be whole numbers 0-100.');w[k]=n}const s=Number($('st').value);if(sum(w)<1)return err('At least one weight must be above 0.');if(isNaN(s)||s<1||s>14)return err('Sleep target must be 1-14 hours.');S.set.w=w;S.set.sleepT=s;save();render()}
function rw(){S.set.w=Object.assign({},DEF.set.w);S.set.sleepT=7;save();render()}
V.week=()=>{const T=today(),days=[0,1,2,3,4,5,6].map(i=>addD(T,i-6)),sc=days.map(d=>score(d).total);let dn_=0,tt=0;const cons=c=>{let a=0,b=0;days.forEach(d=>{const r=ratio(d,c);if(r.t){b++;if(r.n===r.t)a++}});return{a,b}};
days.forEach(d=>{const r=ratio(d);dn_+=r.n;tt+=r.t});const st=cons(0),fi=cons(1),lg=days.filter(d=>S.insta[d]!=null),av=lg.length?Math.round(lg.reduce((a,d)=>a+S.insta[d],0)/lg.length):null,bi=sc.indexOf(Math.max(...sc)),L=S.set.limit,sg=[];
if(av!=null&&av>L)sg.push(`Instagram averaged ${av} min vs your ${L} min limit. Pick one time slot for it and log it right after.`);
if(fi.b&&fi.a/fi.b<.7)sg.push('Fitness was inconsistent. Schedule your workout at a fixed time before the day gets busy.');
if(st.b&&st.a/st.b<.7)sg.push('Study consistency is low. Break study tasks into smaller 25-minute blocks.');
if(tt&&dn_/tt<.6)sg.push('You finished under 60% of tasks. Plan fewer tasks per day and keep the high-priority ones first.');
if(lg.length<4)sg.push('Log Instagram minutes daily so this review is accurate.');if(!tt)sg.push('Add daily tasks to get a useful review.');
if(!sg.length)sg.push('Strong week. Raise one target slightly next week.');
return`<h2>Weekly review</h2><div class=m>${days[0]} to ${T}</div><div class=grid style="margin-top:10px"><div class=card><small>Tasks completed</small><div class=big style="font-size:24px">${dn_}/${tt}</div></div><div class=card><small>Avg Instagram</small><div class=big style="font-size:24px">${av==null?'-':av+'m'}</div></div><div class=card><small>Study consistency</small><div class=big style="font-size:24px">${st.b?st.a+'/'+st.b+' days':'-'}</div></div><div class=card><small>Fitness consistency</small><div class=big style="font-size:24px">${fi.b?fi.a+'/'+fi.b+' days':'-'}</div></div></div>
<div class=card><b>Daily discipline scores</b><div class=ch>${days.map((d,i)=>`<div>${sc[i]}<i style="height:${Math.max(sc[i],2)}%;background:${i===bi&&sc[i]>0?'var(--g)':'#3a3a3a'}"></i>${wd(d)}</div>`).join('')}</div><small>${sc[bi]>0?'Best day: '+wd(days[bi])+' ('+sc[bi]+')':'No scored days yet'}</small></div><div class=card><b>Next week</b><ul>${sg.slice(0,2).map(s=>`<li>${s}</li>`).join('')}</ul></div>`};
V.more=()=>`<h2>Settings & data</h2><div class=card><b>College hours</b><br><label>Start</label><input type=time id=cs value="${S.set.cs}"><label>End</label><input type=time id=ce value="${S.set.ce}"><div class=err id=er></div><button class=b onclick="sc_()">Save hours</button></div>
<div class=card><b>Backup</b><div class=m>Everything is stored only on this device. No account, no servers.</div><br><button class=b onclick="ex()">Export backup (.json)</button><br><br><label>Restore from backup</label><input type=file id=imf accept=".json,application/json" onchange="im_(this)"><button class=b2 onclick="if(confirm('Delete ALL data on this device?')){S=norm();save();render()}">Erase all data</button></div>`;
function sc_(){const a=$('cs').value,b=$('ce').value;if(!a||!b||a>=b)return err('End time must be after start time.');S.set.cs=a;S.set.ce=b;save();err('Saved.')}
function ex(){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='machaa-os-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function im_(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.tasks))throw 0;if(confirm('Replace current data with this backup?')){S=norm(j);save();render()}}catch(e){alert('That file is not a valid MACHAA OS backup.')}};r.readAsText(f)}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
